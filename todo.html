:root{
  --paper:#ffffff; --card:#ffffff; --ink:#2b74bd; --text:#2c4660; --line:#b9d8f3; --soft:#e4f1fc; --tint:#f3f8fd; --fill:#bcdaf4;
  --deep:#2b7fd4; --muted:#557a9a; --yellow:#fbf1c7; --yellow-ink:#4a3d00; --star:#f5d548; --knob:#ffffff;
  --font:"Dunggeunmiso","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#191919; --card:#1d2836; --ink:#9fcdf4; --text:#d6e6f3; --line:#3f6488; --soft:#223448; --tint:#1a2533; --fill:#2f5d88;
  --deep:#4a9bf0; --muted:#8fa9c0; --yellow:#4a3f12; --yellow-ink:#f3dc7a; --star:#e9c84a; --knob:#e8f1fa; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#191919; --card:#1d2836; --ink:#9fcdf4; --text:#d6e6f3; --line:#3f6488; --soft:#223448; --tint:#1a2533; --fill:#2f5d88;
  --deep:#4a9bf0; --muted:#8fa9c0; --yellow:#4a3f12; --yellow-ink:#f3dc7a; --star:#e9c84a; --knob:#e8f1fa; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--text);font-family:var(--font);padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px dashed var(--deep);outline-offset:2px}
.w{border:2px solid var(--line);border-radius:22px;background:var(--card);padding:18px;display:flex;flex-direction:column;gap:14px}
.w.tint{background:var(--tint)}
.head{display:flex;align-items:center;gap:10px}
.head h1{margin:0;font-size:14px;letter-spacing:2px;color:var(--ink);font-weight:700;margin-right:auto}
.icon{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;color:var(--ink);flex:none}
.icon:hover{background:var(--soft)}
.icon svg{width:15px;height:15px}
.btn{border:1.8px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px;line-height:1.3}
.btn:hover{background:var(--soft)}
.btn.main{background:var(--deep);border-color:var(--deep);color:var(--knob)}
.btn:disabled{opacity:.4;cursor:default}
.field{border:1.8px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--card);font-size:13px;min-width:0}
.field:focus-visible{outline:none;border-color:var(--deep)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.nav{display:flex;align-items:center;gap:6px}
.date{position:relative;font-size:13px;font-weight:700;padding:4px 8px;border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--ink)}
.date:hover{background:var(--soft)}
.date input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.nav .icon{width:28px;height:28px}
.today{border:none;background:var(--deep);color:var(--knob);border-radius:999px;font-size:11.5px;padding:3px 10px}
.sheet{border:2px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:auto 1fr auto auto;min-height:40px;border-top:2px solid var(--line)}
.item:first-child{border-top:none}
.ck{border:none;border-right:2px solid var(--line);background:none;display:grid;place-items:center;padding:0 8px}
.tg{position:relative;width:46px;height:24px;border-radius:999px;background:var(--soft);display:block;transition:background .2s}
.tg i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--knob);box-shadow:0 1.5px 2px rgba(40,90,140,.25);transition:left .22s cubic-bezier(.5,1.6,.5,1)}
.done .tg{background:var(--deep)}
.done .tg i{left:24px}
input.txt{border:none;background:none;width:100%;min-width:0;padding:6px 10px;font-size:15px}
input.txt:focus-visible{outline:none}
.done input.txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line);text-decoration-thickness:2px}
.item:focus-within{background:var(--soft)}
.del{border:none;background:none;color:var(--muted);font-size:17px;padding:0 10px;opacity:0}
.mv{border:none;background:none;color:var(--muted);padding:0 4px;opacity:0;display:grid;place-items:center}
.mv svg{width:14px;height:14px}
.mv:hover{color:var(--deep)}
.item:hover .del,.del:focus-visible,.item:hover .mv,.mv:focus-visible{opacity:1}
@media (hover:none){.del,.mv{opacity:.55}}
.bar{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.today b{font-weight:700;margin-left:3px}

</style></head><body>
<div class="w"><div class="head"><h1>TO DO</h1>
<div class="nav"><button class="icon" id="prev" aria-label="전날"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><label class="date"><span id="date"></span><input type="date" id="pick" aria-label="날짜 고르기"></label><button class="icon" id="next" aria-label="다음날"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div></div>
<div class="bar" id="bar" hidden><button class="today" id="all" hidden></button><button class="today" id="carry" hidden>못 끝낸 일 가져오기<b id="carryN"></b></button><button class="today" id="back" hidden>오늘 날짜로</button></div>
<div class="sheet" id="sheet"></div></div>
<script>
const S={get(k,d){try{const v=localStorage.getItem('fd_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
         set(k,v){try{localStorage.setItem('fd_'+k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAY_START=5;
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const todayKey=()=>keyOf(new Date(Date.now()-DAY_START*3600e3));
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const diffDays=(a,b)=>Math.round((parseKey(b)-parseKey(a))/864e5);
const WEEK='일월화수목금토';
const fmtLong=k=>{const d=parseKey(k);return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${WEEK[d.getDay()]}요일`};
// 다른 위젯에서 바뀐 내용 반영
addEventListener('storage',e=>{if(e.key&&e.key.startsWith('fd_')&&window.refresh)refresh()});

let today=todayKey(),cur=today,todos=[];
const short=k=>{const d=parseKey(k);return `${d.getMonth()+1}.${d.getDate()} (${WEEK[d.getDay()]})`};
/* 구글 시트 'TO DO' 탭과 동기화 */
const P=new URLSearchParams(location.search),API=P.get('api')||'',KEY=P.get('key')||'';
const typing=()=>document.activeElement&&document.activeElement.classList.contains('txt');
const pushT={};
const hasText=t=>String(t.text||'').trim();
const newId=()=>Date.now()*1000+Math.floor(Math.random()*1000);
function saveDay(k,list){S.set('todos_'+k,list);S.set('todo_ts_'+k,Date.now());S.set('todo_dirty_'+k,1);
  if(!API)return;clearTimeout(pushT[k]);pushT[k]=setTimeout(()=>push(k),700)}
function save(){saveDay(cur,todos)}
/* 미루기: 오늘 이후 날짜면 다음날로, 지난 날짜면 오늘로 */
async function moveOn(t){
  const k=cur>=today?addDays(cur,1):today;
  todos.splice(todos.indexOf(t),1);save();render();
  if(API)await pull(k,true);
  const l=S.get('todos_'+k,[]).filter(hasText);l.push({id:newId(),text:t.text,done:false});saveDay(k,l);carry()}
/* 지난 7일 동안 못 끝낸 일 → 오늘로 */
const PAST=7;
function pastUndone(){const out=[];for(let i=PAST;i>=1;i--){const k=addDays(today,-i);S.get('todos_'+k,[]).forEach(t=>{if(hasText(t)&&!t.done)out.push([k,t])})}return out}
function carry(){const n=cur===today?pastUndone().length:0;$('carry').hidden=!n;$('carryN').textContent=n||'';$('back').hidden=cur===today;
  const left=todos.filter(t=>hasText(t)&&!t.done).length;$('all').hidden=!left;$('all').innerHTML=(cur>=today?'전부 다음날로':'전부 오늘로')+'<b>'+left+'</b>';
  $('bar').hidden=$('carry').hidden&&$('back').hidden&&$('all').hidden}
async function moveAll(){
  const go=todos.filter(t=>hasText(t)&&!t.done);if(!go.length)return;
  const k=cur>=today?addDays(cur,1):today;
  todos=todos.filter(t=>!go.includes(t));save();render();
  if(API)await pull(k,true);
  const l=S.get('todos_'+k,[]).filter(hasText);go.forEach(t=>l.push({id:newId(),text:t.text,done:false}));saveDay(k,l);carry()}
async function scanPast(){if(API){const ks=[];for(let i=1;i<=PAST;i++)ks.push(addDays(today,-i));await Promise.all(ks.map(k=>pull(k,true)))}carry()}
async function bringPast(){
  const list=pastUndone();if(!list.length)return;
  const by={};list.forEach(([k,t])=>(by[k]=by[k]||[]).push(t.id));
  Object.entries(by).forEach(([k,ids])=>saveDay(k,S.get('todos_'+k,[]).filter(t=>!ids.includes(t.id))));
  todos=todos.filter(hasText).concat(list.map(([,t])=>({id:newId(),text:t.text,done:false})));save();render();carry()}
async function push(k){
  const items=S.get('todos_'+k,[]).filter(t=>String(t.text||'').trim()),ts=S.get('todo_ts_'+k,Date.now());
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:KEY,action:'todo',date:k,items,ts})});
    const j=await r.json();if(j.ok&&S.get('todo_ts_'+k,0)===ts)S.set('todo_dirty_'+k,0)}catch(e){}
}
async function pull(k,quiet){
  if(!API)return;
  try{const r=await fetch(API+'?what=todo&date='+k+'&key='+encodeURIComponent(KEY)+'&t='+Date.now());const j=await r.json();if(j.error)return;
    const lt=S.get('todo_ts_'+k,0),dirty=S.get('todo_dirty_'+k,0),local=S.get('todos_'+k,[]);
    if(j.items===null){if(local.some(t=>String(t.text||'').trim()))push(k);return}
    if(dirty&&lt>=j.ts){push(k);return}
    if(j.ts>=lt&&JSON.stringify(j.items)!==JSON.stringify(local.filter(t=>String(t.text||'').trim()))){
      S.set('todos_'+k,j.items);S.set('todo_ts_'+k,j.ts);S.set('todo_dirty_'+k,0);if(k===cur&&!typing())show(cur,true);carry()}
  }catch(e){}
}
function show(k,quiet){cur=k;todos=S.get('todos_'+cur,[]);$('date').textContent=short(cur);$('pick').value=cur;render();carry();if(!quiet){pull(cur);if(cur===today)scanPast()}}
function render(focusId,end){
  const sh=$('sheet');sh.innerHTML='';
  if(!todos.length)todos.push({id:Date.now(),text:'',done:false});
  todos.forEach((t,i)=>{
    const row=document.createElement('div');row.className='item'+(t.done?' done':'');
    const ck=document.createElement('button');ck.className='ck';ck.innerHTML='<span class="tg"><i></i></span>';ck.setAttribute('aria-label',t.done?'완료 취소':'완료');
    ck.onclick=()=>{t.done=!t.done;save();row.classList.toggle('done',t.done);carry()};
    const inp=document.createElement('input');inp.className='txt';inp.value=t.text;inp.id='t'+t.id;inp.autocomplete='off';inp.setAttribute('aria-label','할 일');
    inp.oninput=()=>{t.text=inp.value;save();carry()};
    inp.onkeydown=e=>{if(e.isComposing)return;
      if(e.key==='Enter'){e.preventDefault();const n={id:Date.now(),text:'',done:false};todos.splice(i+1,0,n);save();render(n.id)}
      else if(e.key==='Backspace'&&!inp.value&&todos.length>1){e.preventDefault();todos.splice(i,1);save();render(todos[Math.max(0,i-1)].id,true)}
      else if(e.key==='ArrowUp'&&i>0){e.preventDefault();$('t'+todos[i-1].id).focus()}
      else if(e.key==='ArrowDown'&&i<todos.length-1){e.preventDefault();$('t'+todos[i+1].id).focus()}};
    const mv=document.createElement('button');mv.className='mv';mv.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';mv.setAttribute('aria-label',cur>=today?'다음날로 미루기':'오늘로 옮기기');mv.title=mv.getAttribute('aria-label');
    mv.onclick=()=>{if(hasText(t))moveOn(t)};
    const del=document.createElement('button');del.className='del';del.textContent='×';del.setAttribute('aria-label','삭제');
    del.onclick=()=>{todos.splice(todos.indexOf(t),1);save();render()};
    row.append(ck,inp,mv,del);sh.append(row)});
  if(focusId!=null){const f=$('t'+focusId);if(f){f.focus();if(end)f.setSelectionRange(f.value.length,f.value.length)}}
}
window.refresh=()=>{if(!typing())show(cur,true)};
setInterval(()=>{if(!document.hidden)pull(cur)},60000);
addEventListener('focus',()=>pull(cur));document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull(cur)});
$('prev').onclick=()=>show(addDays(cur,-1));$('next').onclick=()=>show(addDays(cur,1));
$('back').onclick=()=>show(today);$('carry').onclick=bringPast;$('all').onclick=moveAll;$('pick').onchange=e=>{if(e.target.value)show(e.target.value)};
setInterval(()=>{const t=todayKey();if(t!==today){const was=cur===today;today=t;if(was)show(today)}},30000);
show(today);

</script></body></html>
