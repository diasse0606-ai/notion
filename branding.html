<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>푸우리 Illustration Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* Layout: 갤러리 중심 포트폴리오 — 얇은 머리띠(이름·메뉴), 작품이 화면 대부분, 탭으로 Works/Goods/About/Contact */
:root{
  --paper:#ffffff; --ink:#1d2533; --sub:#7a8494; --rule:#e8edf3; --accent:#2b7fd4; --tile:#f3f6fa;
  --latin:"Jost","Pretendard",sans-serif; --body:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121418;--ink:#e9edf3;--sub:#8b95a5;--rule:#262b33;--accent:#6aaee6;--tile:#1b1f26;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121418;--ink:#e9edf3;--sub:#8b95a5;--rule:#262b33;--accent:#6aaee6;--tile:#1b1f26;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.7;padding:0 max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:28px 0 24px}
.logo{display:flex;flex-direction:column;line-height:1.2}
.logo b{font-size:20px;font-weight:600;letter-spacing:.04em}
.logo span{font-family:var(--latin);font-weight:300;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--sub)}
nav{display:flex;gap:clamp(14px,3vw,30px)}
nav button{font-family:var(--latin);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--sub);padding:4px 0;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--ink)}
.lead{padding:clamp(28px,6vw,64px) 0 clamp(28px,5vw,48px);display:flex;flex-direction:column;gap:6px}
.lead small{font-family:var(--latin);font-weight:300;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--sub)}
.lead p{margin:0;font-size:15px}
.topics{display:flex;gap:14px;align-items:baseline;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:28px;font-size:13px}
.topics b{font-family:var(--latin);font-weight:500;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);flex:none}
.view{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rows{display:flex;flex-direction:column;gap:clamp(10px,1.6vw,18px)}
.row{display:flex;gap:clamp(10px,1.6vw,18px);width:100%}
.row .piece{min-width:0;height:100%}
@media (max-width:560px){.row{flex-direction:column;aspect-ratio:auto!important}.row .piece{flex:none!important;height:auto}.row .piece img{height:auto}}
.piece{position:relative;overflow:hidden;background:var(--tile);cursor:zoom-in;display:block}
.piece img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s ease,opacity .4s}
.piece:hover img{transform:scale(1.025)}
.piece .cap{position:absolute;left:12px;bottom:10px;font-family:var(--latin);font-size:11px;letter-spacing:.16em;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45);opacity:0;transition:opacity .3s}
.piece:hover .cap{opacity:1}
.goods{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:clamp(12px,2vw,22px)}
.good{display:flex;flex-direction:column;gap:10px;cursor:zoom-in}
.good .ph{aspect-ratio:1;background:var(--tile);display:grid;place-items:center;overflow:hidden}
.good img{width:84%;height:84%;object-fit:contain;transition:transform .5s}
.good:hover img{transform:scale(1.04)}
.good span{font-size:13px;text-align:center}
.about{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:start}
@media (max-width:640px){.about{grid-template-columns:1fr}}
.about .pic{aspect-ratio:1;background:var(--tile);overflow:hidden;display:grid;place-items:center}
.about .pic img{width:100%;height:100%;object-fit:cover}
.about .pic img.cloud{width:50%;height:auto;object-fit:contain}
.about h2{margin:0 0 4px;font-size:26px;font-weight:600}
.about .en{font-family:var(--latin);font-weight:300;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--sub)}
dl{margin:28px 0 0;display:grid;grid-template-columns:auto 1fr;gap:12px 28px}
dt{font-family:var(--latin);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--sub);padding-top:2px}
dd{margin:0}
.dots{display:flex;gap:8px}
.dots i{width:18px;height:18px;border-radius:50%;border:1px solid var(--rule)}
.block{max-width:720px}
.block h3{font-family:var(--latin);font-weight:400;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--sub);margin:0 0 16px}
.block+.block{margin-top:48px}
.req{font-size:15px;margin:0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:14px 0;border-bottom:1px solid var(--rule);vertical-align:top}
td:first-child{font-weight:600;width:40%}
td.s{color:var(--sub);font-size:13px}
.notice{white-space:pre-line;color:var(--sub);margin:16px 0 0}
.links a{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--rule);transition:padding .3s}
.links a:hover{padding-left:6px;color:var(--accent)}
.links b{font-family:var(--latin);font-weight:400;font-size:17px;letter-spacing:.06em}
.links span{font-size:12.5px;color:var(--sub)}
footer{margin-top:clamp(56px,9vw,110px);padding:26px 0 calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--latin);font-size:11px;letter-spacing:.2em;color:var(--sub)}
footer nav a{font-size:11px;letter-spacing:.2em;text-transform:uppercase}
footer nav a:hover{color:var(--ink)}
.box{position:fixed;inset:0;background:rgba(10,12,16,.88);display:grid;place-items:center;padding:24px;z-index:20;cursor:zoom-out;animation:fade .25s}
.box img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.box .x{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(18px + env(safe-area-inset-right,0px));color:#fff;font-family:var(--latin);font-size:12px;letter-spacing:.24em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="wrap">
<header><a class="logo" href="#works" data-v="works"><b id="logo"></b><span>Illustration Portfolio</span></a>
<nav id="nav"><button data-v="works">Works</button><button data-v="goods">Goods</button><button data-v="about">About</button><button data-v="contact">Contact</button></nav></header>
<div class="lead"><small>Freelance Illustrator</small><p id="intro"></p></div>
<div class="topics" id="topics" hidden><b>Topics</b><span id="topicTxt"></span></div>
<main id="main"></main>
<footer><span id="copy"></span><nav id="sns"></nav></footer>
</div>
<div class="box" id="box" hidden><img id="boxImg" alt=""><span class="x">Close</span></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let B={},W=[],G=[];
const VIEWS=['works','goods','about','contact'];
function ratioOf(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i.naturalWidth/i.naturalHeight);i.onerror=()=>r(.75);i.src=src})}
async function works(){
  const list=await Promise.all(W.map(async w=>({...w,src:'artboard/'+encodeURIComponent(w.file),r:await ratioOf('artboard/'+encodeURIComponent(w.file))})));
  const rows=[list.slice(0,3)];for(let i=3;i<list.length;i+=2)rows.push(list.slice(i,i+2));
  if(rows.length>1&&rows[rows.length-1].length===1)rows[rows.length-2].push(rows.pop()[0]);
  return '<div class="rows">'+rows.filter(r=>r.length).map(r=>`<div class="row" style="aspect-ratio:${r.reduce((t,w)=>t+w.r,0).toFixed(3)}">${r.map(w=>`<a class="piece" href="#" data-src="${w.src}" style="flex:${w.r.toFixed(3)} 1 0"><img src="${w.src}" alt="${esc(w.name||'')}" loading="lazy">${w.name||w.date?`<span class="cap">${esc(w.name||'')} ${esc(w.date||'')}</span>`:''}</a>`).join('')}</div>`).join('')+'</div>';
}
function goods(){return '<div class="goods">'+G.map(n=>{const s='goods/'+encodeURIComponent(n)+'.png';return `<a class="good" href="#" data-src="${s}"><span class="ph"><img src="${s}" alt="${esc(n)}" loading="lazy"></span><span>${esc(n.replace(/\s*\(.*\)\s*$/,''))}</span></a>`}).join('')+'</div>'}
function about(){
  const pal=(B.palette||[]).filter(c=>/^#[0-9a-f]{3,8}$/i.test(c.hex||''));
  return `<div class="about"><div class="pic"><img src="profile.png" alt="" onerror="this.onerror=null;this.className='cloud';this.src='cloud.png'"></div>
  <div><h2>${esc(B.name)}</h2><span class="en">Illustrator</span>
  <dl><dt>Profile</dt><dd>${esc(B.intro)}</dd>
  ${B.main?`<dt>Specialty</dt><dd>${esc(B.main)}</dd>`:''}
  ${(B.keywords||[]).length?`<dt>Keywords</dt><dd>${esc(B.keywords.join(' · '))}</dd>`:''}
  ${pal.length?`<dt>Palette</dt><dd class="dots">${pal.map(c=>`<i style="background:${c.hex}" title="${esc(c.role)} ${esc(c.hex)}"></i>`).join('')}</dd>`:''}
  <dt>Tools</dt><dd>Clip Studio Paint</dd></dl></div></div>`}
function contact(){
  const pr=(B.prices||[]).filter(p=>p.type);
  return `<div class="block"><h3>Commission</h3>${B.request?`<p class="req">${esc(B.request)}</p>`:''}
  ${pr.length?`<table>${pr.map(p=>`<tr><td>${esc(p.type)}</td><td>${esc(p.price||'문의')}</td><td class="s">${esc([p.period,p.note].filter(Boolean).join(' · '))}</td></tr>`).join('')}</table>`:''}
  ${B.notice?`<p class="notice">${esc(B.notice)}</p>`:''}</div>
  <div class="block"><h3>Contact</h3><div class="links">${(B.links||[]).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener"><b>${esc(l.label)}</b><span>${esc(l.sub||'')} ↗</span></a>`).join('')}</div></div>`}
async function show(v){
  if(!VIEWS.includes(v))v='works';
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  const html=v==='works'?await works():v==='goods'?goods():v==='about'?about():contact();
  $('main').innerHTML=`<div class="view">${html}</div>`;
  try{history.replaceState(null,'','#'+v)}catch(e){}
}
document.addEventListener('click',e=>{
  const n=e.target.closest('[data-v]');if(n){e.preventDefault();show(n.dataset.v);return}
  const p=e.target.closest('[data-src]');if(p){e.preventDefault();$('boxImg').src=p.dataset.src;$('box').hidden=false;return}
  if(e.target.closest('#box'))$('box').hidden=true;
});
addEventListener('keydown',e=>{if(e.key==='Escape')$('box').hidden=true});
Promise.all([fetch('brand.json?t='+Date.now()).then(r=>r.json()).catch(()=>({})),fetch('artboard/list.json?t='+Date.now()).then(r=>r.json()).catch(()=>[]),fetch('goods/list.json?t='+Date.now()).then(r=>r.json()).catch(()=>[])]).then(([b,w,g])=>{
  B=b;W=w;G=g;$('logo').textContent=b.name||'';$('intro').textContent=b.intro||'';document.title=(b.name||'')+' Illustration Portfolio';
  if(b.topic){$('topics').hidden=false;$('topicTxt').textContent=b.topic}
  $('copy').textContent='© '+(b.name||'')+' · 무단 사용 및 2차 가공 금지';
  $('sns').innerHTML=(b.links||[]).slice(0,2).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('');
  $('sns').style.cssText='display:flex;gap:18px';
  show((location.hash||'').slice(1));
});
</script></body></html>
