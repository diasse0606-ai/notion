<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>푸우리 — Illustrator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* Layout: 포트폴리오 한 장 — 상단 띠, 이름+대표작 히어로, 소개 3단, 작품 그리드, 커미션 표, 연락처 */
:root{
  --paper:#fbfcfe; --ink:#16233a; --soft-ink:#5d6b80; --rule:#d9e3ef; --accent:#2b7fd4; --tint:#eef4fb;
  --display:"Gowun Batang","Noto Serif KR",serif; --latin:"Cormorant Garamond","Gowun Batang",serif;
  --body:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#141a24;--ink:#e8eef7;--soft-ink:#9aa9bd;--rule:#2b3a4f;--accent:#6aaee6;--tint:#1a2433;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#141a24;--ink:#e8eef7;--soft-ink:#9aa9bd;--rule:#2b3a4f;--accent:#6aaee6;--tint:#1a2433;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.6;padding:0 max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0;border-bottom:1px solid var(--rule);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft-ink)}
.bar nav{display:flex;gap:18px;flex-wrap:wrap}
.bar nav a{text-decoration:none}.bar nav a:hover{color:var(--accent)}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(24px,5vw,64px);align-items:end;padding:clamp(32px,6vw,72px) 0 clamp(28px,4vw,48px);border-bottom:1px solid var(--rule)}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.eyebrow{font-family:var(--latin);font-style:italic;font-size:20px;color:var(--accent)}
.name{font-family:var(--display);font-weight:700;font-size:clamp(52px,10vw,104px);line-height:.95;letter-spacing:-.02em;margin:10px 0 18px;text-wrap:balance}
.intro{font-size:16px;max-width:30em;color:var(--soft-ink);margin:0}
.feat{margin:0;position:relative}
.feat img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;border-radius:2px}
.feat figcaption{display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:.12em;color:var(--soft-ink);padding-top:8px;text-transform:uppercase}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--rule)}
@media (max-width:640px){.facts{grid-template-columns:1fr}}
.fact{padding:22px 20px 22px 0;display:flex;flex-direction:column;gap:6px}
.fact+.fact{padding-left:20px;border-left:1px solid var(--rule)}
@media (max-width:640px){.fact+.fact{border-left:none;border-top:1px solid var(--rule);padding-left:0}}
.lab{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft-ink)}
.val{font-family:var(--display);font-size:18px}
.sw{display:flex;gap:8px;align-items:center}
.sw button{width:26px;height:26px;border-radius:50%;border:1px solid var(--rule);padding:0;cursor:pointer;background:var(--tint)}
section{padding:clamp(28px,5vw,56px) 0;border-bottom:1px solid var(--rule)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px}
.sh h2{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(24px,4vw,34px)}
.sh span{font-family:var(--latin);font-style:italic;font-size:18px;color:var(--soft-ink)}
.works{columns:3 220px;column-gap:14px}
.works figure{margin:0 0 14px;break-inside:avoid;position:relative;overflow:hidden;border-radius:2px;background:var(--tint)}
.works img{width:100%;display:block;transition:transform .5s}
.works figure:hover img{transform:scale(1.03)}
.works figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 10px;font-size:12px;letter-spacing:.08em;color:#fff;background:linear-gradient(transparent,rgba(10,20,35,.6));opacity:0;transition:opacity .3s}
.works figure:hover figcaption{opacity:1}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft-ink);font-weight:500;text-align:left;padding:0 0 10px;border-bottom:1px solid var(--ink)}
td{padding:16px 0;border-bottom:1px solid var(--rule);vertical-align:top}
td:first-child{font-family:var(--display);font-size:18px;font-weight:700;width:34%}
td.price{font-size:17px;font-weight:600}
td.muted{color:var(--soft-ink);font-size:13px}
.tw{overflow-x:auto}
details{margin-top:18px}
details summary{cursor:pointer;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
details p{white-space:pre-line;color:var(--soft-ink);margin:12px 0 0;max-width:42em}
.contact{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0}
.contact a{display:flex;justify-content:space-between;align-items:baseline;gap:10px;text-decoration:none;padding:16px 0;border-bottom:1px solid var(--rule);margin-right:24px}
.contact a b{font-family:var(--display);font-size:20px}
.contact a span{font-size:12.5px;color:var(--soft-ink)}
.contact a:hover b{color:var(--accent)}
.contact a i{font-style:normal;color:var(--accent)}
footer{padding:22px 0 0;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft-ink);display:flex;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:6px 14px;font-size:12.5px;border-radius:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="wrap">
<div class="bar"><span>Illustration Portfolio</span><nav id="nav"></nav></div>
<div class="hero"><div><div class="eyebrow">Illustrator</div><h1 class="name" id="nm"></h1><p class="intro" id="intro"></p></div>
<figure class="feat" id="feat" hidden><img id="featImg" alt=""><figcaption><span id="featName"></span><span id="featDate"></span></figcaption></figure></div>
<div class="facts"><div class="fact"><span class="lab">Specialty</span><span class="val" id="main"></span></div>
<div class="fact"><span class="lab">Keywords</span><span class="val" id="kw"></span></div>
<div class="fact"><span class="lab">Palette</span><span class="sw" id="pal"></span></div></div>
<section><div class="sh"><h2>작품</h2><span>Selected Works</span></div><div class="works" id="works"></div></section>
<section><div class="sh"><h2>커미션</h2><span>Commission</span></div>
<div class="tw"><table><thead><tr><th>작업</th><th>가격</th><th>기간</th><th>비고</th></tr></thead><tbody id="prices"></tbody></table></div>
<details id="noticeBox" hidden><summary>커미션 안내</summary><p id="notice"></p></details></section>
<section style="border-bottom:none"><div class="sh"><h2>연락처</h2><span>Contact</span></div><div class="contact" id="links"></div></section>
<footer><span id="foot"></span><span>Made with Clip Studio Paint</span></footer>
</div><div class="toast" id="toast" hidden></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function brand(b){
  document.title=(b.name||'')+' — Illustrator';
  $('nm').textContent=b.name||'';$('intro').textContent=b.intro||'';$('main').textContent=b.main||'—';
  $('kw').textContent=(b.keywords||[]).join(' · ')||'—';
  const pal=(b.palette||[]).filter(c=>/^#[0-9a-f]{3,8}$/i.test(c.hex||''));
  $('pal').innerHTML=pal.length?pal.map(c=>`<button style="background:${c.hex}" data-hex="${esc(c.hex)}" aria-label="${esc(c.role)} ${esc(c.hex)} 복사" title="${esc(c.role)} ${esc(c.hex)}"></button>`).join(''):'<span class="val">—</span>';
  $('prices').innerHTML=(b.prices||[]).map(p=>`<tr><td>${esc(p.type)}</td><td class="price">${esc(p.price||'—')}</td><td class="muted">${esc(p.period||'—')}</td><td class="muted">${esc(p.note||'')}</td></tr>`).join('');
  $('noticeBox').hidden=!b.notice;$('notice').textContent=b.notice||'';
  $('links').innerHTML=(b.links||[]).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener"><b>${esc(l.label)}</b><span>${esc(l.sub||'')} <i>↗</i></span></a>`).join('');
  $('nav').innerHTML=(b.links||[]).slice(0,2).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('');
  $('foot').textContent='© '+new Date().getFullYear()+' '+(b.name||'');
}
function works(list){
  if(!list.length)return;const f=list[0];
  $('feat').hidden=false;$('featImg').src='artboard/'+encodeURIComponent(f.file);$('featName').textContent=f.name||'';$('featDate').textContent=f.date||'';
  $('works').innerHTML=list.map(w=>`<figure><img src="artboard/${encodeURIComponent(w.file)}" alt="${esc(w.name||'')}" loading="lazy">${w.name||w.date?`<figcaption>${esc(w.name||'')} ${esc(w.date||'')}</figcaption>`:''}</figure>`).join('');
}
$('pal').onclick=e=>{const s=e.target.closest('button');if(!s)return;navigator.clipboard?.writeText(s.dataset.hex).then(()=>{const t=$('toast');t.textContent=s.dataset.hex.toUpperCase()+' 복사됨';t.hidden=false;setTimeout(()=>t.hidden=true,1400)},()=>{})};
fetch('brand.json?t='+Date.now()).then(r=>r.json()).then(brand).catch(()=>{});
fetch('artboard/list.json?t='+Date.now()).then(r=>r.json()).then(works).catch(()=>{});
</script></body></html>
